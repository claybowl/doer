services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doer
      POSTGRES_PASSWORD: doer
      POSTGRES_DB: doer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doer -d doer"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://doer:doer@db:5432/doer
      PORT: "3100"
      SERVE_UI: "true"
      DOER_DEPLOYMENT_MODE: "authenticated"
      DOER_DEPLOYMENT_EXPOSURE: "private"
      DOER_PUBLIC_URL: "${DOER_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - doer-data:/doer
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  doer-data:
